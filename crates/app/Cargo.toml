[package]
name = "ghostrealm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "ghostrealm"

[dependencies]
ghostrealm-core.workspace = true
ghostrealm-lsp.workspace = true
ghostrealm-terminal.workspace = true
ghostrealm-terminal-ghostty.workspace = true
ghostrealm-web.workspace = true
ghostrealm-process.workspace = true
anyhow.workspace = true
winit = "0.30"
wgpu = "30"
glyphon = "0.12"
pollster = "0.4"
bytemuck = { version = "1.25.2", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
arboard = "3"
unicode-width = "0.2"
# The locale cosmic-text orders font fallback by, for a DB the app builds.
sys-locale = "0.3.2"
# File browser preview: still-image decode, and audio playback (symphonia codecs).
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
# Markdown Preview: CommonMark + GFM tables, task lists, strikethrough.
pulldown-cmark = { version = "0.13.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSURL", "NSFileManager"] }

[build-dependencies]
# Reads the nested web host build's JSON messages (build.rs).
serde_json = "1"
