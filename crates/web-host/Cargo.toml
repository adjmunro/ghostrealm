[package]
name = "ghostrealm-web-host"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "ghostrealm-web-host"

[features]
# The bundler needs CEF's build utilities (cargo metadata, plist writing).
bundle = ["cef/build-util", "dep:semver"]

[[bin]]
name = "ghostrealm-web-host"
path = "src/main.rs"

# macOS: Chromium's GPU/renderer/utility subprocesses run from helper app
# bundles inside the host bundle; this is their executable.
[[bin]]
name = "ghostrealm-web-host-helper"
path = "src/bin/helper.rs"

# Assembles the runnable host bundle next to the `ghostrealm` binary.
[[bin]]
name = "ghostrealm-web-bundle"
path = "src/bin/bundle.rs"
required-features = ["bundle"]

[dependencies]
ghostrealm-web.workspace = true
cef = { version = "154.4.0", default-features = false }
serde_json = "1"
semver = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSRunningApplication",
] }
