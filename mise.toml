[tools]
zig = "0.16.0"
# Build CEF's C++ wrapper (cef-dll-sys) for the web host crate.
cmake = "4.4.4"
ninja = "1.13.2"

# Build the CEF web host and bundle it beside the `ghostrealm` binary, where the
# app looks for it. Always build with `--features bundle` so cef isn't rebuilt
# when switching between the host and the bundler.
# It ends with clean-stale: a changed CEF build leaves the old ~600 MB
# download behind. Not with CARGO_TARGET_DIR set: that dir may be shared with
# other workspaces, whose units clean-stale would take for unlisted ones. A
# failed cleanup doesn't fail the task: the bundle is already built.
[tasks.web]
run = [
    "cargo build -p ghostrealm-web-host --features bundle --bins",
    "cargo run -p ghostrealm-web-host --features bundle --bin ghostrealm-web-bundle",
    'if [ -n "${CARGO_TARGET_DIR:-}" ]; then echo "CARGO_TARGET_DIR is set; clean-stale skipped"; elif ! mise run clean-stale; then echo "clean-stale failed; the web host is bundled"; fi',
]

# Remove build artifacts that a newer build superseded (Cargo never does).
# `mise run clean-stale -- --dry-run` lists what would go; see
# scripts/clean-stale.rs for what is kept. A target dir a build holds is skipped.
[tasks.clean-stale]
run = "mkdir -p target && rustc -O --edition 2021 scripts/clean-stale.rs -o target/clean-stale && target/clean-stale"

# clean-stale, plus: other worktrees' target dirs get the same superseded-unit
# cleanup, except agent worktrees' (.claude/worktrees/*), which are emptied once
# idle, as are target dirs in this project's scratchpads and ghostrealm target
# dirs in the temp dir. Idle: nothing built or run there for --idle-hours
# (default 2). Emptying keeps CACHEDIR.TAG, the lock files and dirs with other
# locks. Also removes temp-dir leftovers of tests and web hosts that are gone.
# `-- --dry-run` lists what would go.
[tasks.clean-all]
run = "mise run clean-stale -- --all"
