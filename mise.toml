[tools]
zig = "0.16.0"
# Build CEF's C++ wrapper (cef-dll-sys) for the web host crate.
cmake = "4.4.4"
ninja = "1.13.2"

# Remove build artifacts that a newer build superseded (Cargo never does), in
# target/ and in target/web-host (the web host's own target dir).
# `mise run clean-stale -- --dry-run` lists what would go; see
# scripts/clean-stale.rs for what is kept. A target dir a build holds is skipped.
# `-- --unused-days N` also removes units nothing has used for N days.
[tasks.clean-stale]
run = "mkdir -p target && rustc -O --edition 2021 scripts/clean-stale.rs -o target/clean-stale && target/clean-stale"

# clean-stale, plus: other worktrees' target dirs get the same superseded-unit
# cleanup; agent worktrees' (.claude/worktrees/*) get it unless emptied. Those,
# target dirs in this project's scratchpads and ghostrealm target dirs in the
# temp dir are emptied once idle and no running program lives in them. Idle:
# nothing built or run there for --idle-hours (default 2). Emptying keeps
# CACHEDIR.TAG, the lock files and dirs with other locks; target/web-host is
# emptied under its own locks. Also removes temp-dir
# leftovers of tests and web hosts that are gone. Emptying and temp-dir removal
# need what runs, which is read only on macOS. `-- --dry-run` lists what would
# go.
[tasks.clean-all]
run = "mise run clean-stale -- --all"
